version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo123
      POSTGRES_DB: bingo
    ports:
      - 5434:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
